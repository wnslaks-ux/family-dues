server:
  port: ${PORT:8080}
  servlet:
    encoding: {charset: UTF-8, enabled: true, force: true}
  tomcat:
    uri-encoding: UTF-8
spring:
  datasource:
    url: jdbc:h2:file:./data/familydues;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql.init.mode: always
  sql.init.encoding: UTF-8
  mvc.view.prefix: /WEB-INF/jsp/
  mvc.view.suffix: .jsp
mybatis:
  configuration.map-underscore-to-camel-case: true
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin123}
